[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-rl-agent"
version = "0.1.0"
description = "A production-grade architecture combining Meta-Reinforcement Learning and AutoML for autonomous AI research."
authors = [{ name = "Zitouni Nidhal" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "gymnasium>=0.29.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "faiss-cpu>=1.8.0",
    "scikit-learn>=1.4.0",
    "optuna>=3.5.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "tensorboard>=2.16.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.2",
    "typer[all]>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "streamlit>=1.32.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
self-improving-rl = "src.interface.cli:app"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests", "self-improving-rl-agent/tests"]
pythonpath = [".", "self-improving-rl-agent"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
